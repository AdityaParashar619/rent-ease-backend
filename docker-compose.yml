services:
  postgres:
    image: postgres:16-alpine
    container_name: rentease-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: rentease_db
      POSTGRES_USER: rentease_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the environment}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentease_user -d rentease_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
